[project]
name = "swarmgate"
version = "0.1.0"
description = "Experiments on how agent populations learn their oversight from blocking feedback and shared memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=1.0",
    "google-genai>=1.0",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
