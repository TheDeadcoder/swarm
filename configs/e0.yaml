name: e0-main
seed: 0
n_guards_per_class: 20
probe_len: 16
min_blocked_probes: 4
min_allowed_probes: 4
n_queries: 12
k_values: [0, 1, 2, 4, 8, 16]
modes: [verbose, generic, camouflaged, fake_success]
env_error_rate: 0.1
reveal_rate: 0.5
termination:
  threshold: 3
  delays: [0, 3]
bootstrap: 2000
workers: 4

observers:
  claude-sonnet-5-5:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    max_tokens: 16000
  gemini:
    provider: google
    model: null
  llama:
    provider: openai_compat
    base_url: https://api.llama.com/compat/v1/
    api_key_env: LLAMA_API_KEY
    model: null
  local:
    provider: openai_compat
    base_url: http://localhost:8000/v1
    api_key_env: LOCAL_API_KEY
    model: null
  mock:
    provider: mock
