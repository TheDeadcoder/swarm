name: e1v2-pilot
out: runs/v2/repair-pilot
donor: claude-sonnet-5
good_faith: true
kinds: [syn]
arms: []
lineages: 13
generations: 8
max_calls: 40
seed: 0
workers: 4
budget_usd: 12
branches:
  A1U: {parent: A1, at: 4, variant: G, source: runs/e1}
  A1R: {parent: A1, at: 4, variant: G2, source: runs/e1}
  A4C: {parent: A4, at: 4, variant: G2, source: runs/e1}
syn:
  readers: [cat, head, tail, less, grep, sed, awk, base64]
  patterns: [secret, .key, cred, token, vault]
  net_tools: [curl, wget]
